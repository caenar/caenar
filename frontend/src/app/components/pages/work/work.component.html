<section class="intro-inner">
  <div class="intro">
    <h1>Works</h1>
    <div class="filters">
      <div class="cta" 
      (click)="filter('all')"
      [class.selected-tag]="selectedTag === 'all'">
        <a>all</a>
      </div>
      <div class="cta" *ngFor="let tag of DATA_TAGS" 
      (click)="filter(tag.name)"
      [class.selected-tag]="selectedTag === tag.name">
        <a>{{ tag.name }}</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="item" *ngFor="let project of filteredProjects">
      <div
        class="item-img"
        [style.background-image]="'url(' + project.assets[10] + ')'"
      ></div>
      <div class="project-info">
        <h1 class="item-name">{{ project.name }}</h1>
        <div class="category">
          <p *ngFor="let tag of project.tags; let last = last">
            {{ tag }}
            <ng-icon *ngIf="!last" name="ionRadioButtonOnOutline"></ng-icon>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
