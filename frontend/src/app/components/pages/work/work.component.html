<section class="intro-inner">
  <div class="intro">
    <h1>Works</h1>
    <div class="filters">
      <div
        class="cta"
        (click)="filter('all')"
        [class.selected-tag]="selectedTag === 'all'"
      >
        <a>all</a>
      </div>
      <div
        class="cta"
        *ngFor="let tag of ACTIVE_TAGS"
        (click)="filter(tag.name)"
        [class.selected-tag]="selectedTag === tag.name"
      >
        <a>{{ tag.name }}</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="item" *ngFor="let project of filteredProjects">
      <a [routerLink]="[createProjectName(project.name)]">
        <div
          class="item-img"
          [style.background-image]="'url(' + project.assets[9] + ')'"
        ></div>
      </a>
      <div class="project-info">
        <h1 class="item-name">{{ project.name }}</h1>
        <div class="category">
          <p *ngFor="let tag of project.tags; let last = last">
            {{ tag }}
            <img
              loading="lazy"
              alt="An image of a small dot"
              src="/assets/images/dot.png"
              *ngIf="!last"
            />
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
<section class="archive">
  <a class="cta" routerLink="/archive">
    View archive <sup>{{ archivedProject.length }}</sup>
  </a>
</section>
